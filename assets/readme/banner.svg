<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-labelledby="title desc">
<title id="title">njia</title>
<desc id="desc">njia, Smile ID's flow navigation engine: one flow engine, one back stack, one contract on four SDKs.</desc>
<style>.route{stroke-dasharray:6 8;animation:walk 1.6s linear infinite}@keyframes walk{to{stroke-dashoffset:-28}}.pushed{animation:push 6s cubic-bezier(.33,1,.68,1) infinite}@keyframes push{0%,12%{opacity:0;transform:translateX(28px)}24%,62%{opacity:1;transform:translateX(0)}74%,100%{opacity:0;transform:translateX(28px)}}.under{animation:under 6s ease-in-out infinite}@keyframes under{0%,12%,74%,100%{opacity:1}24%,62%{opacity:.55}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.walker{display:none}}</style>
<defs>
<linearGradient id="ground" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B1220"/><stop offset="0.55" stop-color="#0F1E2A"/><stop offset="1" stop-color="#14303A"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#59D8C9"/><stop offset="1" stop-color="#F2C14E"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#59D8C9" stop-opacity=".22"/><stop offset="1" stop-color="#59D8C9" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#FFFFFF"/></pattern>
<clipPath id="card"><rect width="1200" height="160" rx="16"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="160" fill="url(#ground)"/>
<rect width="1200" height="160" fill="url(#dots)" opacity=".06"/>
<circle cx="124" cy="82" r="120" fill="url(#glow)"/>
<circle cx="1076" cy="82" r="120" fill="url(#glow)" opacity=".8"/>
<rect y="154" width="1200" height="6" fill="url(#accent)"/>
</g>
<g fill="none" stroke-linecap="round">
<path d="M64 116 C64 82 96 82 96 64 S128 44 136 70 S166 108 184 82" stroke="#59D8C9" stroke-width="3" opacity=".25"/>
<path class="route" d="M64 116 C64 82 96 82 96 64 S128 44 136 70 S166 108 184 82" stroke="url(#accent)" stroke-width="3.5"/>
<circle cx="64" cy="116" r="9" fill="#0B1220" stroke="#59D8C9" stroke-width="4"/>
<circle cx="136" cy="70" r="9" fill="#0B1220" stroke="#9CD7A0" stroke-width="4"/>
<circle cx="184" cy="82" r="9" fill="#0B1220" stroke="#F2C14E" stroke-width="4"/>
<circle class="walker" r="5" fill="#FFFFFF"><animateMotion dur="3.2s" repeatCount="indefinite" path="M64 116 C64 82 96 82 96 64 S128 44 136 70 S166 108 184 82"/></circle>
</g>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="232" y="48" font-size="13" font-weight="700" letter-spacing="3.2" fill="url(#accent)">SMILE ID · FLOW NAVIGATION</text>
<text x="228" y="102" font-size="58" font-weight="800" letter-spacing="0.5" fill="#FFFFFF">njia</text>
<text x="232" y="134" font-size="19" font-weight="500" fill="#8DA2C0">One flow engine, one back stack, one contract on four SDKs · Swahili for path</text>
</g>
<g transform="translate(1018 34)">
<rect x="0" y="54" width="104" height="32" rx="8" fill="#0F1E2A" stroke="#59D8C9" stroke-width="2" opacity=".35"/>
<rect x="10" y="36" width="104" height="32" rx="8" fill="#0F1E2A" stroke="#59D8C9" stroke-width="2.5" opacity=".6"/>
<rect class="under" x="20" y="18" width="104" height="32" rx="8" fill="#0F1E2A" stroke="url(#accent)" stroke-width="2.5"/>
<g class="pushed"><rect x="30" y="0" width="104" height="32" rx="8" fill="#12303A" stroke="url(#accent)" stroke-width="3"/>
<path d="M44 16 h44" stroke="#F2C14E" stroke-width="3" stroke-linecap="round" opacity=".8"/></g>
</g>
</svg>
