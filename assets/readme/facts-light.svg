<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 94" width="960" height="94" role="img" aria-labelledby="title desc">
<title id="title">njia in four numbers</title>
<desc id="desc">One pure reducer in both native cores. 32 scenarios, run on all four hosts by Maestro. No dependencies beyond the standard library. Line coverage of 95% or more on every package.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#59636e;font-size:13px}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.ink{fill:#1f2328}.b{font-weight:600}.eyebrow{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;letter-spacing:.08em;fill:#59636e}.still{display:none}@media (prefers-reduced-motion:reduce){[class^=m],[class*=' m']{animation:none!important}.moving{display:none}.still{display:inline}}</style>
<rect x="0.5" y="0.5" width="227" height="93" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="16" y="28" text-anchor="start" class="eyebrow">REDUCER</text>
<text x="16" y="62" class="ink" style="font-size:26px;font-weight:700">1</text>
<text x="16" y="82" text-anchor="start" class="" style="font-size:12px">pure, in both native cores</text>
<rect x="244.5" y="0.5" width="227" height="93" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="260" y="28" text-anchor="start" class="eyebrow">SCENARIOS</text>
<text x="260" y="62" class="ink" style="font-size:26px;font-weight:700">32</text>
<text x="260" y="82" text-anchor="start" class="" style="font-size:12px">run on all four hosts by Maestro</text>
<rect x="488.5" y="0.5" width="227" height="93" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="504" y="28" text-anchor="start" class="eyebrow">DEPENDENCIES</text>
<text x="504" y="62" class="ink" style="font-size:26px;font-weight:700">0</text>
<text x="504" y="82" text-anchor="start" class="" style="font-size:12px">beyond the standard library</text>
<rect x="732.5" y="0.5" width="227" height="93" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="748" y="28" text-anchor="start" class="eyebrow">LINE COVERAGE</text>
<text x="748" y="62" class="ink" style="font-size:26px;font-weight:700">≥ 95%</text>
<text x="748" y="82" text-anchor="start" class="" style="font-size:12px">on every package, or CI fails</text>
</svg>
